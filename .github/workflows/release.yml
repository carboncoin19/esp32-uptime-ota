name: Build & Release Firmware

# Triggers when you push a tag like: v1.1.7
# The tag must match FW_VERSION in src/main.cpp (tag v1.1.7 <-> "1.1.7").
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Devices report FW_VERSION, not the tag name — fail fast if they differ
      - name: Check tag matches FW_VERSION
        run: |
          FW=$(sed -nE 's/^#define FW_VERSION +"([^"]+)".*/\1/p' src/main.cpp)
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG FW_VERSION=$FW"
          if [ "$FW" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match FW_VERSION \"$FW\" in src/main.cpp. Bump FW_VERSION, commit, then re-tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      # Transition builds — DEFAULT_DEVICE_NAME baked in for remote OTA of existing devices
      - name: Build NDONI transition firmware (ESP32)
        run: pio run -e ndoni

      - name: Build KAINJI transition firmware (ESP32)
        run: pio run -e kainji

      # Universal builds — device name set via USB serial on first boot
      - name: Build universal ESP32 firmware
        run: pio run -e esp32

      - name: Build universal ESP32-C3 firmware
        run: pio run -e esp32c3

      - name: Rename binaries
        run: |
          cp .pio/build/ndoni/firmware.bin   firmware-esp32-ndoni.bin
          cp .pio/build/kainji/firmware.bin  firmware-esp32-kainji.bin
          cp .pio/build/esp32/firmware.bin   firmware-esp32.bin
          cp .pio/build/esp32c3/firmware.bin firmware-esp32c3.bin

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-esp32-ndoni.bin
            firmware-esp32-kainji.bin
            firmware-esp32.bin
            firmware-esp32c3.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
