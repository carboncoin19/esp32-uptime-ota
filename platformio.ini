; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<clear_dev_name.cpp>

; -------------------------------------------------------
; TRANSITION ENVS — used once to OTA existing devices.
; After OTA runs, device name is saved to NVS.
; Remove DEFAULT_DEVICE_NAME flag from future releases.
; -------------------------------------------------------

[env:ndoni]
extends = common
build_flags =
  -D DEFAULT_DEVICE_NAME='"NDONI-UPTIME"'
  -D TRACK_PIN=27
  -D MIRROR_PIN=2
  -D WIFI1_SSID='"ndoni"'
  -D WIFI1_PASSWORD='"12345678"'
  -D WIFI2_SSID='"STARLINK"'
  -D WIFI2_PASSWORD='"TrojanDelta"'

[env:kainji]
extends = common
build_flags =
  -D DEFAULT_DEVICE_NAME='"KAINJI-UPTIME"'
  -D TRACK_PIN=27
  -D MIRROR_PIN=2

; -------------------------------------------------------
; UNIVERSAL ENVS — for all new devices going forward.
; Flash once, configure name via USB serial on first boot.
; -------------------------------------------------------

[env:esp32]
extends = common
build_flags =
  -D TRACK_PIN=27
  -D MIRROR_PIN=2

[env:esp32c3]
extends = common
board = esp32-c3-devkitm-1
build_flags =
  -D TRACK_PIN=10
  -D MIRROR_PIN=8
  -D MIRROR_ACTIVE_LOW=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; -------------------------------------------------------
; UTILITY — flash once to wipe dev_name from NVS, then
; reflash esp32c3 to re-trigger the serial name prompt.
; -------------------------------------------------------

[env:clear_dev_name]
extends = common
board = esp32-c3-devkitm-1
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<clear_dev_name.cpp>
